name: CI Afrosa

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: afrosa
          POSTGRES_USER: afrosa_user
          POSTGRES_PASSWORD: afrosa123
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://afrosa_user:afrosa123@localhost:5432/afrosa
          JWT_SECRET: test_secret
          PORT: 3000
        run: npm test